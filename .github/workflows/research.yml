name: Trend research

# Research tooling and historical evidence have their own validation path.
# Product TypeScript/Rust contracts remain in CI; deployment does not depend on this workflow.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research.yml"
      - "scripts/requirements-trend.txt"
      - "scripts/trend/**"
      - "research/trend/**"
      - "crates/quant/**"
      - "packages/quant-core/**"
      - "apps/quant-lab/**"
  pull_request:
    paths:
      - ".github/workflows/research.yml"
      - "scripts/requirements-trend.txt"
      - "scripts/trend/**"
      - "research/trend/**"
      - "crates/quant/**"
      - "packages/quant-core/**"
      - "apps/quant-lab/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-trend.txt

      - name: Install research test dependencies
        run: python -m pip install -r scripts/requirements-trend.txt

      - name: Validate trend research contracts
        run: python -m unittest discover -s scripts/trend -p 'test_*.py'

      - name: Validate frozen research evidence
        run: python scripts/trend/cli.py audit --frozen
