name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run all browser variants, native integration and standalone builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The Agent submodule pins its own Rust version. Targets installed for
      # stable are not shared with that toolchain; resolve it from its directory.
      - name: Prepare Agent Runtime Rust toolchain
        working-directory: crates/agent-runtime
        run: |
          rustup show active-toolchain
          rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/quant/target
            crates/kernels/target
            crates/agent-runtime/target
          key: rust-${{ runner.os }}-${{ hashFiles('crates/quant/Cargo.lock', 'crates/kernels/Cargo.lock', 'crates/agent-runtime/Cargo.lock', 'crates/agent-runtime/rust-toolchain.toml') }}

      - name: Install dependencies
        run: bun ci

      - name: Install wasm-pack
        env:
          VERSION: 0.15.0
        run: curl -sSf https://raw.githubusercontent.com/wasm-bindgen/wasm-pack/v0.15.0/docs/_installer/init.sh | sh

      - name: Build kernels, Quant and Agent WASM
        run: bun run build:wasm

      - name: Check TypeScript, formatting, and lint
        run: bun run check

      - name: Run TypeScript tests
        run: |
          bun run test
          bun run test:ci

      - name: Run Rust tests
        run: cargo test --manifest-path crates/kernels/Cargo.toml

      - name: Run Quant Rust tests
        run: bun run test:rust:quant

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-jsg.txt

      - name: Validate trend research contracts and frozen evidence
        run: |
          bun run research:trend:test
          bun run research:trend audit --frozen

      - name: Validate ClickHouse research export boundary
        run: |
          python -m pip install -r scripts/requirements-jsg.txt
          python scripts/test_export_jsg.py
          python scripts/test_reconcile_jsg.py

      # Native CLI integration and the upstream submodule's entire workspace
      # are outside the browser deployment path. Keep them on demand.
      - name: Verify native ClickHouse integration
        if: github.event_name == 'workflow_dispatch' && inputs.full
        env:
          JSG_BINARY: ${{ github.workspace }}/crates/quant/target/debug/jsg
        run: |
          python -m pip install chdb==4.4.0
          cargo build --manifest-path crates/quant/Cargo.toml --bin jsg
          python scripts/test_native_jsg.py

      - name: Run Agent Runtime Rust tests
        if: github.event_name == 'workflow_dispatch' && inputs.full
        working-directory: crates/agent-runtime
        run: cargo test

      - name: Build standalone apps and demo
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: |
          node_modules/.bin/vp -C apps/media-studio build
          node_modules/.bin/vp -C apps/quant-lab build
          node_modules/.bin/vp -C apps/market-board build
          node_modules/.bin/vp -C apps/manga-studio build
          node_modules/.bin/vp -C examples/demo build

      - name: Build BCR Studio
        run: node_modules/.bin/vp -C apps/studio build

      - name: Validate Cloudflare Worker bundle
        run: bun run deploy:cloudflare -- --dry-run

      - name: Upload BCR Studio static bundle
        uses: actions/upload-artifact@v4
        with:
          name: studio-dist
          path: apps/studio/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

      - name: Upload WASM packages
        uses: actions/upload-artifact@v4
        with:
          name: wasm-packages
          # Artifact paths are relative to their common ancestor: crates/.
          path: |
            crates/kernels/pkg
            crates/quant/pkg
            crates/agent-wasm/pkg
          if-no-files-found: error
          retention-days: 1

  browser-e2e:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [workspace, quant, reader]
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 30 || 15 }}
    env:
      BCR_BROWSER_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'full' || 'core' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Download WASM packages
        uses: actions/download-artifact@v4
        with:
          name: wasm-packages
          path: crates

      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Download production Studio bundle
        if: matrix.group == 'reader'
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: apps/studio/dist

      - name: Verify production Reader PWA
        if: matrix.group == 'reader'
        run: bun run test:pwa

      - name: Verify independent PWA installation and offline starts
        if: matrix.group == 'reader' && github.event_name == 'workflow_dispatch' && inputs.full
        run: bun run test:pwa:apps

      - name: Verify production Notes PWA
        if: matrix.group == 'reader'
        run: bun run test:pwa:knowledge

      - name: Verify production knowledge offline and sync
        if: matrix.group == 'reader'
        run: BCR_KNOWLEDGE_PRODUCTION=1 node scripts/verify-knowledge.mjs

      - name: Run browser verification
        run: node scripts/verify-ci.mjs --suite="$BCR_BROWSER_SUITE" --group="${{ matrix.group }}"

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ matrix.group }}
          path: scripts/shots
          if-no-files-found: warn
          retention-days: 7

  deploy-cloudflare:
    name: Deploy BCR Studio to Cloudflare Workers
    needs: browser-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Bun
        if: steps.cloudflare.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deployment dependencies
        if: steps.cloudflare.outputs.configured == 'true'
        run: bun ci

      - name: Download validated Studio bundle
        if: steps.cloudflare.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: studio-dist
          path: apps/studio/dist

      - name: Deploy static SPA Worker
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:cloudflare -- --message "BCR Studio ${GITHUB_SHA::12}"

      - name: Verify deployed assets
        if: steps.cloudflare.outputs.configured == 'true'
        # 部署面自检：资产必须是资产而非 SPA 兜底 HTML（本地套件没有这层语义）。
        run: node scripts/verify-deploy.mjs https://bcr-studio.2494726068.workers.dev
