name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/kernels/target
          key: rust-${{ runner.os }}-${{ hashFiles('crates/kernels/Cargo.lock') }}

      - name: Install dependencies
        run: bun ci

      - name: Install wasm-pack
        env:
          VERSION: 0.15.0
        run: curl -sSf https://raw.githubusercontent.com/wasm-bindgen/wasm-pack/v0.15.0/docs/_installer/init.sh | sh

      - name: Build WASM kernels
        run: bun run build:wasm

      - name: Check TypeScript, formatting, and lint
        run: bun run check

      - name: Run TypeScript tests
        run: bun run test

      - name: Run Rust tests
        run: cargo test --manifest-path crates/kernels/Cargo.toml

      - name: Build Media Studio
        run: node_modules/.bin/vp -C apps/media-studio build

      - name: Build BCR Studio
        run: node_modules/.bin/vp -C apps/studio build

      - name: Build demo
        run: node_modules/.bin/vp -C examples/demo build

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: crates/kernels/pkg
          if-no-files-found: error
          retention-days: 1

  browser-e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun ci

      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: crates/kernels/pkg

      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser verification
        run: bun run test:browser

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: scripts/shots
          if-no-files-found: warn
          retention-days: 7
