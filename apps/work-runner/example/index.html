<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>年卡，去多少次才划算？</title>
  <style>
    body {
      background: #f2eee5;
      color: #18392e;
      font: 18px/1.8 system-ui;
      margin: 0;
      padding: clamp(24px, 7vw, 80px);
    }
    main {
      max-width: 800px;
      margin: auto;
    }
    small {
      letter-spacing: 2px;
      color: #637469;
    }
    h1 {
      font-size: clamp(30px, 6vw, 60px);
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -2px;
    }
    label {
      display: block;
      margin: 40px 0 16px;
    }
    input {
      width: 100%;
      accent-color: #235942;
    }
    #result {
      font-size: 28px;
      margin: 36px 0;
    }
    footer {
      border-top: 1px solid #a3b0a0;
      padding-top: 24px;
      color: #637469;
      font-size: 14px;
    }
  </style>
  <main>
    <small>生活里的经济学 / 001</small>
    <h1>年卡，去多少次才划算？</h1>
    <p>拖动次数，比较同一组假设下的现金支出。</p>
    <label for="visits">每年到访 <strong id="count"></strong> 次</label
    ><input id="visits" type="range" min="1" max="365" />
    <div id="result" aria-live="polite"></div>
    <footer>价格为演示假设，不代表真实商家报价。网页与视频共享 data.json 和 model.js。</footer>
  </main>
  <script type="module">
    import { costs } from "./model.js";
    const data = await (await fetch("./data.json")).json();
    const slider = document.querySelector("#visits");
    slider.value = data.visits;
    function update() {
      const visits = Number(slider.value),
        result = costs({ ...data, visits });
      document.querySelector("#count").textContent = visits;
      document.querySelector("#result").textContent =
        `年卡 ¥${result.annualTotal} / 按次 ¥${result.payPerVisitTotal}。第 ${result.firstCheaperVisit} 次起，年卡更省钱。`;
    }
    slider.addEventListener("input", update);
    update();
  </script>
</html>
