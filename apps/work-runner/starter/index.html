<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Untitled Work</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f5f6f2; color: #17231e; }
    main { max-width: 720px; margin: auto; padding: 12vh 8vw; }
    small { color: #5c7467; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 12ch; margin: 24px 0; font-size: clamp(42px, 9vw, 88px); line-height: .98; letter-spacing: -.06em; }
    p { color: #5c7467; font-size: 20px; line-height: 1.7; }
    .result { margin: 56px 0; padding: 28px; border: 1px solid #cbd7cf; border-radius: 24px; background: #fff; font-size: 28px; }
    label { display: grid; gap: 16px; color: #5c7467; }
    input { accent-color: #e26f45; }
  </style>
  <main>
    <small>生活里的经济学 / new work</small>
    <h1>从一个问题开始。</h1>
    <p>这是一个可以同时承载页面和视频的 Work 工程。替换 brief、model、data 和场景，保持目标 ID 稳定。</p>
    <label for="value">参数 <strong id="count"></strong></label>
    <input id="value" type="range" min="0" max="100000" step="1" />
    <div class="result" id="result" aria-live="polite"></div>
  </main>
  <script type="module">
    import { result } from "./model.js";
    const data = await (await fetch("./data.json")).json();
    const input = document.querySelector("#value");
    const count = document.querySelector("#count");
    const output = document.querySelector("#result");
    input.value = data.value;
    function update() {
      const next = result({ value: Number(input.value) });
      count.textContent = next.value;
      output.textContent = `当前值 ${next.value}，计算结果 ${next.doubled}。`;
    }
    input.addEventListener("input", update);
    update();
  </script>
</html>
