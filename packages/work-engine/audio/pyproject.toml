[project]
name = "bcr-audio-tools"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "qwen-asr==0.0.6",
  "transformers==4.57.6",
  "torch==2.10.0+cu128",
  "numpy==2.4.2",
  "soundfile==0.13.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "ruff==0.16.10",
]
