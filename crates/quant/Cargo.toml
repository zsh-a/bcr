[package]
name = "bcr-quant"
version = "0.1.0"
edition = "2021"
description = "Deterministic daily multi-asset JSG research engine for native Rust and WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-array = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
