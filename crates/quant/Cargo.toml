[package]
name = "bcr-quant"
version = "0.1.0"
edition = "2021"
description = "Deterministic daily multi-asset JSG research engine for native Rust and WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arrow-array = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arrow-ipc = { version = "60", default-features = false, features = ["lz4", "zstd"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
arrow-select = { version = "60", default-features = false }
rayon = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
